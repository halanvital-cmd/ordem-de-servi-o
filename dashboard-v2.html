<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manutenção 360 — Nova Identidade</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#E9EEF5}#status{position:fixed;right:14px;bottom:12px;z-index:10;background:#172D4D;color:#fff;padding:7px 10px;border-radius:7px;font:600 11px Segoe UI,Arial;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:.88}</style></head><body><iframe id="dash" src="dashboard.html" title="Dashboard Manutenção 360"></iframe><div id="status">Prévia · Nova identidade</div><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument;const l=d.createElement('link');l.rel='stylesheet';l.href='manutencao360-theme.css?v=2';d.head.appendChild(l);setTimeout(()=>document.getElementById('status').style.display='none',3500)}catch(e){document.getElementById('status').textContent='Abra pelo GitHub Pages para visualizar o tema';}});</script></body></html>
