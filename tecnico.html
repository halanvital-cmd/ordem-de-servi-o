<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manutenção 360 | Técnico</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fa;font-family:Segoe UI,Arial;color:#13233c}header{background:linear-gradient(90deg,#061d47,#1266b1);color:white;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.brand b{font-size:18px}.brand small{display:block;color:#cde5f7;margin-top:3px}.wrap{max-width:760px;margin:auto;padding:16px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.chip{border:1px solid #c7d9e7;background:white;color:#174b77;border-radius:20px;padding:8px 12px;white-space:nowrap;cursor:pointer}.chip.active{background:#1266b1;color:white}.os{background:white;border:1px solid #d9e4ee;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #1235}.row{display:flex;justify-content:space-between;gap:10px}.id{font-weight:800;color:#0b4e86}.badge{background:#e2eff9;color:#075b99;border-radius:15px;padding:5px 8px;font-size:11px;font-weight:800}.meta{font-size:12px;color:#6c8095;margin-top:7px}.problem{background:#f6f9fc;border-radius:7px;padding:10px;margin:12px 0;font-size:13px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.btn{border:0;border-radius:7px;padding:10px;background:#1266b1;color:white;font-weight:700;cursor:pointer}.secondary{background:#e4edf5;color:#234a6c}.done{background:#071f4b}.modal{display:none;position:fixed;inset:0;background:#07182b99;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{background:white;width:min(760px,100%);border-radius:18px 18px 0 0;padding:20px}.sheet textarea,.sheet input{width:100%;padding:10px;border:1px solid #cbdbe7;border-radius:7px;margin:6px 0 12px}.sheet label{font-size:11px;font-weight:800;color:#60758b}</style></head><body><header><div class="brand"><b>Manutenção 360</b><small>Meu Trabalho • Técnico</small></div><a href="manutencao360-demo.html" style="color:white;text-decoration:none">Gestão</a></header><main class="wrap"><h2>Minhas Ordens de Serviço</h2><div class="filters"><button class="chip active" onclick="filterOS('',this)">Todas</button><button class="chip" onclick="filterOS('Programada',this)">Programadas</button><button class="chip" onclick="filterOS('Em execução',this)">Em execução</button><button class="chip" onclick="filterOS('Aguardando material',this)">Aguard. material</button><button class="chip" onclick="filterOS('Finalizada',this)">Finalizadas</button></div><div id="list"></div></main><div class="modal" id="modal"><div class="sheet"><h3 id="mtitle">Atualizar OS</h3><label>Atualização / serviço realizado</label><textarea id="note" rows="4" placeholder="Descreva o que foi realizado..."></textarea><label>Material utilizado</label><input id="material" placeholder="Ex.: Contator 1 un."><div class="actions"><button class="btn secondary" onclick="closeM()">Cancelar</button><button class="btn done" onclick="finish()">Finalizar OS</button></div></div></div><script>let data=JSON.parse(localStorage.getItem('m360-os')||'null')||[{id:'OS-000125',equip:'Puncionadeira Ficep P51',unit:'Matriz',sector:'Pav1',type:'Corretiva',priority:'Alta',tech:'LEANDRO RIBEIRO',date:'2026-09-16',status:'Em execução',problem:'Falha durante operação'},{id:'OS-000124',equip:'Linha de pintura - Elevador cabine 2',unit:'Expansão',sector:'Pintura eletrostática',type:'Preventiva',priority:'Média',tech:'JOSUÉ SOUSA',date:'2026-09-17',status:'Programada',problem:'Preventiva programada'}],filter='',current=null;function render(){let a=data.filter(x=>!filter||x.status===filter);list.innerHTML=a.map(x=>`<article class="os"><div class="row"><span class="id">${x.id}</span><span class="badge">${x.status}</span></div><h3>${x.equip}</h3><div class="meta">${x.unit} • ${x.sector} • ${x.type} • Prioridade ${x.priority}</div><div class="problem">${x.problem||'Sem descrição registrada.'}</div><div class="actions">${x.status==='Programada'?`<button class="btn" onclick="setStatus('${x.id}','Em execução')">▶ Iniciar serviço</button>`:''}<button class="btn secondary" onclick="openM('${x.id}')">✎ Registrar atualização</button>${x.status==='Em execução'?`<button class="btn secondary" onclick="setStatus('${x.id}','Aguardando material')">◷ Aguardar material</button>`:''}${x.status==='Aguardando material'?`<button class="btn" onclick="setStatus('${x.id}','Em execução')">↻ Retomar serviço</button>`:''}<button class="btn done" onclick="openM('${x.id}')">✓ Finalizar</button></div></article>`).join('')||'<p>Nenhuma OS neste status.</p>'}function persist(){localStorage.setItem('m360-os',JSON.stringify(data));render()}function setStatus(id,s){let x=data.find(v=>v.id===id);x.status=s;x.history=x.history||[];x.history.push({at:new Date().toLocaleString('pt-BR'),event:s});persist()}function filterOS(s,b){filter=s;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function openM(id){current=id;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function finish(){let x=data.find(v=>v.id===current);x.status='Finalizada';x.service=note.value;x.material=material.value;x.completed=new Date().toLocaleString('pt-BR');x.history=x.history||[];x.history.push({at:x.completed,event:'OS finalizada'});note.value='';material.value='';closeM();persist()}render()</script></body></html>
