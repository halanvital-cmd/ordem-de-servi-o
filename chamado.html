<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abrir Chamado | Manutenção 360</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fa;font-family:Segoe UI,Arial;color:#13233c}.head{background:linear-gradient(90deg,#061d47,#1266b1);color:#fff;padding:25px;text-align:center}.head h1{margin:0;font-size:24px}.head p{color:#d3e9f8}.card{max-width:680px;margin:25px auto;background:#fff;border:1px solid #d9e4ee;border-radius:14px;padding:22px;box-shadow:0 4px 18px #1232}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:11px;font-weight:800;color:#60758b}input,select,textarea{padding:11px;border:1px solid #c7d8e5;border-radius:7px;font:inherit}button{width:100%;border:0;border-radius:8px;padding:12px;background:#1266b1;color:white;font-weight:800;cursor:pointer}.success{display:none;text-align:center;padding:25px}.success strong{font-size:25px;color:#071f4b}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:1}}</style></head><body><div class="head"><h1>Solicitar Manutenção</h1><p>Registre uma necessidade para a equipe de manutenção</p></div><div class="card"><form id="form" class="grid" onsubmit="send(event)"><div class="f"><label>Unidade</label><select id="unit" required><option>Matriz</option><option>Filial</option><option>Expansão</option></select></div><div class="f"><label>Setor</label><input id="sector" required></div><div class="f"><label>Equipamento</label><input id="equip" required></div><div class="f"><label>Patrimônio</label><input id="asset"></div><div class="f"><label>Solicitante</label><input id="requester" required></div><div class="f"><label>Contato</label><input id="contact"></div><div class="f full"><label>Descrição do problema</label><textarea id="problem" rows="5" required></textarea></div><div class="f full"><button>Enviar solicitação</button></div></form><div class="success" id="success"><p>Solicitação registrada com sucesso.</p><strong id="protocol"></strong><p>A manutenção poderá transformar este chamado em uma Ordem de Serviço.</p><button onclick="location.reload()">Abrir novo chamado</button></div></div><script>function send(e){e.preventDefault();let a=JSON.parse(localStorage.getItem('m360-calls')||'[]'),n=1+Math.max(451,...a.map(x=>+(x.id.match(/\d+/)||[0])[0]));let x={id:'CH-'+String(n).padStart(6,'0'),unit:unit.value,sector:sector.value,equip:equip.value,asset:asset.value,requester:requester.value,contact:contact.value,problem:problem.value,status:'Novo',created:new Date().toLocaleString('pt-BR')};a.unshift(x);localStorage.setItem('m360-calls',JSON.stringify(a));form.style.display='none';success.style.display='block';protocol.textContent=x.id}</script></body></html>
